name: Check PR Source Branch

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check if PR is from stg branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          echo "Source branch is: ${HEAD_REF}"
          echo "Base branch is: ${BASE_REF}"
          if [ "${BASE_REF}" != "main" ]; then
            echo "このPRのターゲットは main ではないため、ブランチチェックをスキップします。"
            exit 0
          fi
          if [ "$HEAD_REF" != "stg" ]; then
            echo "::error::エラー: mainブランチへのPRは、stgブランチからのみ許可されています。"
            exit 1
          fi
          echo "チェック成功: mainブランチに対して、正しいブランチ（stg）からのPRです。"